[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imut-cdr-gc"
version = "0.2.0a3"
description = "Explicit joint CDR generation, native interaction scoring and traceable antibody libraries"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
generation = ["torch>=2.6", "transformers==4.46.3"]
structure = ["torch>=2.6", "torch-geometric>=2.6"]
analysis = ["scipy>=1.11", "pandas>=2", "matplotlib>=3.8"]
test = ["pytest>=8"]

[project.scripts]
imut-cdr-gc = "imut_cdr_gc.cli:main"
imut-naturalness = "imut_cdr_gc.naturalness:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["imut_cdr_gc", "imut_cdr_gc.*"]
exclude = ["tests", "tests.*", "imut_cdr_gc.scoring._validation*"]
namespaces = false

[tool.setuptools.package-data]
"imut_cdr_gc.scoring" = ["*.json", "_vendor/*.json"]
"imut_cdr_gc.models" = ["source_identity.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
